<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azure Demo</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #121b2e;
    --accent: #3b82f6;
    --text: #e8edf7;
    --muted: #8a97ad;
    --ok: #22c55e;
    --border: #1f2b42;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --accent: #2563eb;
      --text: #0f172a;
      --muted: #5b677a;
      --ok: #16a34a;
      --border: #e2e8f0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 24px;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 14px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: none; }
  .row .label { color: var(--muted); font-size: 14px; }
  .row .value { font-weight: 600; font-size: 14px; text-align: right; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--ok);
    margin-right: 6px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  .footer {
    margin-top: 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">Azure App Service</span>
    <h1>Java Demo App</h1>
    <p class="sub">Spring Boot jar running on Azure App Service (Java SE).</p>

    <div class="row">
      <span class="label"><span class="dot"></span>Status</span>
      <span class="value" id="status">checking…</span>
    </div>
    <div class="row">
      <span class="label">Message</span>
      <span class="value" id="message">—</span>
    </div>
    <div class="row">
      <span class="label">Server time</span>
      <span class="value" id="timestamp">—</span>
    </div>

    <button id="refresh">Refresh</button>
    <div class="footer">GET /api/hello · GET /healthz</div>
  </div>

<script>
  async function load() {
    document.getElementById('status').textContent = 'checking…';
    try {
      const [helloRes, healthRes] = await Promise.all([
        fetch('/api/hello'),
        fetch('/healthz')
      ]);
      const hello = await helloRes.json();
      const health = await healthRes.json();
      document.getElementById('status').textContent = health.status === 'ok' ? 'Healthy' : health.status;
      document.getElementById('message').textContent = hello.message;
      document.getElementById('timestamp').textContent = new Date(hello.timestamp).toLocaleString();
    } catch (e) {
      document.getElementById('status').textContent = 'Unreachable';
    }
  }
  document.getElementById('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
